# Dependency updates proposed weekly as pull requests (SEC-01); each goes through CI like any change.
# Minor and patch updates are grouped; a major version comes alone, to be tried on a branch (golden rules).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
